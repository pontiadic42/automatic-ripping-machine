{% if authenticated %}
    {% extends "base.html" %}
{% else %}
    {% extends "support/base_simple.html" %}
{% endif %}
{% block content %}
    <!-- Confirmation dialog for abandon / fix permissions -->
    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="armModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="armModalTitle">Abandon this job?</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body"><span id="m-body">This job will be abandoned.</span></div>
                <div class="modal-footer">
                    <button id="save-no" type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button id="save-yes" type="button" class="btn btn-primary">Abandon job</button>
                </div>
            </div>
        </div>
    </div>
    <div id="message1" class="alert alert-success d-none" role="status"><h4 class="alert-heading"></h4></div>

    <section class="arm-section">
        <div class="arm-head">
            <h1>Drives</h1>
            <span class="arm-head-right arm-faint" id="armUpdated">Loading…</span>
        </div>
        <div id="armAttention"></div>
        <div id="armBays" class="arm-bays"></div>
        <div id="armProcessing" class="arm-card" style="margin-top: 14px; display: none;"></div>
    </section>

    <section class="arm-section">
        <div class="arm-head">
            <h2>Recently finished</h2>
            <a class="arm-head-right" href="/library">Open library</a>
        </div>
        <div id="armRecent" class="arm-grid arm-feed"></div>
    </section>

    <div id="armStats" class="arm-stats"></div>

    <script type="application/javascript">
        window.ARM_REFRESH_MS = {{ armui_cfg['index_refresh'] if armui_cfg else 2000 }};
        window.ARM_AUTHENTICATED = {{ 'true' if authenticated else 'false' }};
    </script>
    <script type="application/javascript" src="static/js/common.js"></script>
    <script type="application/javascript" src="static/js/dashboard.js"></script>
{% endblock %}
{% block js %}{{ super() }}{% endblock %}
